server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Styles are inline <style> blocks; scripts must be files (Cloudflare's /cdn-cgi email-decode script is same-origin).
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 404 /404.html;

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|js)$ {
        expires 7d;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
