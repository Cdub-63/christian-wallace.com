# Written to /etc/rancher/k3s/config.yaml by terraform/cloud-init.yaml at server creation. Cilium replaces Flannel, k3s netpol, and kube-proxy.
flannel-backend: none
disable-network-policy: true
disable-kube-proxy: true
# Lets kubectl reach the API server over Tailscale by the host's MagicDNS name
tls-san:
  - k3s.tailba717.ts.net
