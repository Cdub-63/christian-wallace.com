# Merged into the Helm-managed ArgoCD release (argo-cd chart 10.3.0):
#   helm upgrade argocd argo/argo-cd -n argocd --version 10.3.0 --reuse-values -f k3s/argocd-values.yaml
configs:
  cm:
    # Without this, child Applications report Healthy as soon as they exist, so root's sync waves don't wait for them
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
