apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "10.3.0"
      helm:
        # Must match the bootstrap release name so resource names don't change
        releaseName: argocd
        valueFiles:
          - $values/k3s/argocd-values.yaml
    - repoURL: https://github.com/Cdub-63/christian-wallace.com
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # ArgoCD managing itself: never let a bad render delete its own components
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
