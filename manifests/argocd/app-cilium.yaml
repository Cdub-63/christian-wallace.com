apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: "1.19.5"
    helm:
      values: |
        operator:
          replicas: 1
        kubeProxyReplacement: true
        # Single node: without kube-proxy, Cilium can't use the kubernetes ClusterIP to reach the API server
        k8sServiceHost: 127.0.0.1
        k8sServicePort: 6443
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
